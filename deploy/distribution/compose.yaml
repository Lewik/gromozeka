name: gromozeka

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gromozeka
      POSTGRES_USER: gromozeka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gromozeka -d gromozeka"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: gromozeka
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30

  server:
    image: ghcr.io/lewik/gromozeka-server:${GROMOZEKA_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      GROMOZEKA_MODE: prod
      GROMOZEKA_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gromozeka
      GROMOZEKA_POSTGRES_USERNAME: gromozeka
      GROMOZEKA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: gromozeka
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GROMOZEKA_MCP_ALLOWED_HOSTS: ${GROMOZEKA_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    volumes:
      - gromozeka-home:/var/lib/gromozeka
    ports:
      - "${GROMOZEKA_BIND:-127.0.0.1:8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ghcr.io/lewik/gromozeka-worker:${GROMOZEKA_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      GROMOZEKA_MODE: prod
      GROMOZEKA_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gromozeka
      GROMOZEKA_POSTGRES_USERNAME: gromozeka
      GROMOZEKA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: gromozeka
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GROMOZEKA_RUNTIME_WORKER_ID: compose-primary
      GROMOZEKA_RUNTIME_WORKER_VERSION: ${GROMOZEKA_VERSION:-latest}
      GROMOZEKA_RUNTIME_WORKER_CAPABILITIES: CONVERSATION_TURN,LLM_RUNTIME,TOOL_EXECUTION,LOCAL_AGENT_TOOL,MEMORY_PIPELINE
    volumes:
      - gromozeka-home:/var/lib/gromozeka
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  gromozeka-home:
