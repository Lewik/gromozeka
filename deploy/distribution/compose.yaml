name: gromozeka

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gromozeka
      POSTGRES_USER: gromozeka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gromozeka -d gromozeka"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    image: ghcr.io/lewik/gromozeka-server:${GROMOZEKA_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      GROMOZEKA_MODE: prod
      GROMOZEKA_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gromozeka
      GROMOZEKA_POSTGRES_USERNAME: gromozeka
      GROMOZEKA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GROMOZEKA_MCP_ALLOWED_HOSTS: ${GROMOZEKA_MCP_ALLOWED_HOSTS:?GROMOZEKA_MCP_ALLOWED_HOSTS is required}
      GROMOZEKA_WORKER_ENROLLMENT_ENABLED: ${GROMOZEKA_WORKER_ENROLLMENT_ENABLED:-true}
      GROMOZEKA_TRUST_FORWARDED_HTTPS: "true"
    volumes:
      - gromozeka-home:/var/lib/gromozeka
    expose:
      - "8765"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      GROMOZEKA_PUBLIC_HOST: ${GROMOZEKA_PUBLIC_HOST:?GROMOZEKA_PUBLIC_HOST is required}
      GROMOZEKA_TLS_CERTIFICATE_FILE: ${GROMOZEKA_TLS_CERTIFICATE_FILE:-server.crt}
      GROMOZEKA_TLS_PRIVATE_KEY_FILE: ${GROMOZEKA_TLS_PRIVATE_KEY_FILE:-server.key}
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/${GROMOZEKA_CADDY_CONFIG:-Caddyfile}
      - --adapter
      - caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.internal:/etc/caddy/Caddyfile.internal:ro
      - ./Caddyfile.provided:/etc/caddy/Caddyfile.provided:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

  worker:
    profiles: ["worker"]
    image: ghcr.io/lewik/gromozeka-worker:${GROMOZEKA_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      GROMOZEKA_MODE: prod
      GROMOZEKA_SERVER_URL: ${GROMOZEKA_WORKER_GATEWAY_SERVER_URL:?GROMOZEKA_WORKER_GATEWAY_SERVER_URL is required}
      GROMOZEKA_WORKER_GATEWAY_CREDENTIAL: ${GROMOZEKA_WORKER_GATEWAY_CREDENTIAL:?GROMOZEKA_WORKER_GATEWAY_CREDENTIAL is required}
      GROMOZEKA_SERVER_CA_CERTIFICATE_PATH: ${GROMOZEKA_SERVER_CA_CERTIFICATE_PATH:-}
      GROMOZEKA_RUNTIME_WORKER_ID: ${GROMOZEKA_RUNTIME_WORKER_ID:?GROMOZEKA_RUNTIME_WORKER_ID is required}
      GROMOZEKA_RUNTIME_WORKER_VERSION: ${GROMOZEKA_VERSION:-latest}
      GROMOZEKA_RUNTIME_WORKER_CAPABILITIES: AI_REQUEST_RESPONSE,TOOL_EXECUTION,LOCAL_AGENT_TOOL
    volumes:
      - gromozeka-worker-home:/var/lib/gromozeka
      - ./certs:/certs:ro

volumes:
  postgres-data:
  gromozeka-home:
  gromozeka-worker-home:
  caddy-data:
  caddy-config:
