name: gromozeka

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "5"

x-app-environment: &app-environment
  GROMOZEKA_MODE: prod
  GROMOZEKA_LOG_DIR: /var/lib/gromozeka/logs
  GROMOZEKA_POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/gromozeka
  GROMOZEKA_POSTGRES_USERNAME: gromozeka
  GROMOZEKA_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
    restart: unless-stopped
    shm_size: 256m
    mem_limit: 512m
    environment:
      POSTGRES_DB: gromozeka
      POSTGRES_USER: gromozeka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${GROMOZEKA_DATA_DIR:-/data/gromozeka}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gromozeka -d gromozeka"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    stop_grace_period: 60s
    logging: *json-logging

  server:
    image: ${GROMOZEKA_SERVER_IMAGE:?GROMOZEKA_SERVER_IMAGE is required}
    restart: unless-stopped
    init: true
    mem_limit: 2176m
    env_file:
      - ${GROMOZEKA_DATA_DIR:-/data/gromozeka}/runtime/interactive-access.env
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *app-environment
      GROMOZEKA_MCP_ALLOWED_HOSTS: ${GROMOZEKA_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      GROMOZEKA_TRUST_FORWARDED_HTTPS: "true"
      GROMOZEKA_WORKER_ENROLLMENT_ENABLED: ${GROMOZEKA_WORKER_ENROLLMENT_ENABLED:-true}
      GROMOZEKA_AI_RUNTIME_ENABLED_CONNECTION_IDS: openai-subscription,openai-api
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    volumes:
      - ${GROMOZEKA_DATA_DIR:-/data/gromozeka}/home:/var/lib/gromozeka
    ports:
      - ${GROMOZEKA_SERVER_BIND:-127.0.0.1:8765}:8765
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logging
