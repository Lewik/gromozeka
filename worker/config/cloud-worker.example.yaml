gromozeka:
  worker-gateway:
    enabled: true
    server-url: https://gromozeka.example
    credential: ${GROMOZEKA_WORKER_GATEWAY_CREDENTIAL}
  runtime:
    worker:
      id: cloud-primary
      version: dev
      capabilities:
        - AI_REQUEST_RESPONSE
        - AUDIO_CAPTURE
        - TOOL_EXECUTION
