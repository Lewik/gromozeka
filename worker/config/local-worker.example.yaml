gromozeka:
  worker-gateway:
    enabled: true
    server-url: https://gromozeka.example
    credential: ${GROMOZEKA_WORKER_GATEWAY_CREDENTIAL}
  runtime:
    worker:
      id: macbook-primary
      version: dev
      capabilities:
        - AI_REQUEST_RESPONSE
        - AUDIO_CAPTURE
        - TOOL_EXECUTION
        - LOCAL_AGENT_TOOL
        - COMPUTER_USE
