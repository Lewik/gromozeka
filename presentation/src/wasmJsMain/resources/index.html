<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gromozeka Web</title>
    <meta name="application-name" content="Gromozeka">
    <meta name="theme-color" content="#111318">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Gromozeka">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <script>
        (function () {
            // Mobile Safari keeps layout viewport stable while keyboard/browser chrome changes visualViewport.
            function updateVisualViewport() {
                const viewport = window.visualViewport;
                const root = document.documentElement;
                const width = viewport ? viewport.width : window.innerWidth;
                const height = viewport ? viewport.height : window.innerHeight;
                const left = viewport ? viewport.offsetLeft : 0;
                const top = viewport ? viewport.offsetTop : 0;

                root.style.setProperty("--gromozeka-visual-viewport-width", `${width}px`);
                root.style.setProperty("--gromozeka-visual-viewport-height", `${height}px`);
                root.style.setProperty("--gromozeka-visual-viewport-left", `${left}px`);
                root.style.setProperty("--gromozeka-visual-viewport-top", `${top}px`);
            }

            function updateVisualViewportAndNotifyCompose() {
                updateVisualViewport();
                window.requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
            }

            updateVisualViewport();
            window.addEventListener("orientationchange", () => window.setTimeout(updateVisualViewportAndNotifyCompose, 250));
            document.addEventListener("focusin", () => window.requestAnimationFrame(updateVisualViewportAndNotifyCompose));
            document.addEventListener("focusout", () => window.setTimeout(updateVisualViewportAndNotifyCompose, 250));

            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", updateVisualViewportAndNotifyCompose);
                window.visualViewport.addEventListener("scroll", updateVisualViewportAndNotifyCompose);
                window.visualViewport.addEventListener("scrollend", updateVisualViewportAndNotifyCompose);
            } else {
                window.addEventListener("resize", updateVisualViewport);
            }
        })();
    </script>
    <script defer src="bootstrap-localization.js"></script>
    <script defer type="application/javascript" src="gromozeka.js"></script>
    <script>

        if ("serviceWorker" in navigator && window.isSecureContext) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js").catch(() => {
                    // Local HTTP is expected to skip service workers.
                });
            });
        }
    </script>
    <style>
        :root {
            --gromozeka-visual-viewport-width: 100vw;
            --gromozeka-visual-viewport-height: 100dvh;
            --gromozeka-visual-viewport-left: 0px;
            --gromozeka-visual-viewport-top: 0px;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111318;
            overscroll-behavior: none;
        }

        #gromozekaViewport {
            position: fixed;
            left: var(--gromozeka-visual-viewport-left);
            top: var(--gromozeka-visual-viewport-top);
            width: var(--gromozeka-visual-viewport-width);
            height: var(--gromozeka-visual-viewport-height);
            padding-top: env(safe-area-inset-top);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            box-sizing: border-box;
            overflow: hidden;
            background: #111318;
        }

        #bootstrapLoader {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        #bootstrapLoader svg {
            width: 80px;
            height: 80px;
        }

        #bootstrapLoader .bulb-outline {
            stroke-dasharray: 84 16;
            animation: bootstrap-bulb-gap 2400ms linear infinite;
        }

        @keyframes bootstrap-bulb-gap {
            to { stroke-dashoffset: 100; }
        }

        @media (prefers-reduced-motion: reduce) {
            #bootstrapLoader .bulb-outline {
                animation: none;
                stroke-dasharray: none;
            }
        }

        #composeApp {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="gromozekaViewport">
    <div id="bootstrapLoader" role="status">
        <svg viewBox="112 112 800 800" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <path d="m 512.89258,140.50391 a 252,252 0 0 0 -236.80274,165.81054 252,252 0 0 0 74.82032,279.23242 c 29.16488,25.00535 40.63285,62.50383 34.40234,112.49415 h 255.16016 c -6.23051,-49.99032 5.23746,-87.4888 34.40234,-112.49415 A 252,252 0 0 0 749.69531,306.31445 252,252 0 0 0 512.89258,140.50391 Z" style="fill:none;stroke:#fe8b17;stroke-width:48;stroke-linejoin:round;stroke-linecap:round" class="bulb-outline" pathLength="100"/>
            <path d="M 381.79543,767.99224 H 636.95559" style="fill:none;fill-opacity:1;stroke:#1266d0;stroke-width:48;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:0.996078"/>
            <path d="M 411.59044,837.94346 H 607.16058" style="fill:none;fill-opacity:1;stroke:#1266d0;stroke-width:48;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:0.996078"/>
            <path d="M 450.78705,874.92883 H 567.96397" style="fill:none;fill-opacity:1;stroke:#1266d0;stroke-width:48;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:0.996078"/>
            <path d="M 450.78705,874.92883 C 445.76053,853.94346 432.69499,841.615 411.59044,837.94346 m 161.62251,36.98537 c 5.02652,-20.98537 18.09206,-33.31383 39.19661,-36.98537" style="fill:none;fill-opacity:1;stroke:#1266d0;stroke-width:48;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:0.996078"/>
        </svg>
    </div>
    <div id="composeApp"></div>
</div>
</body>
</html>
