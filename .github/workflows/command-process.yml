name: Command process lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/command-process.yml'
      - '**/*Command*Process*'
      - '**/*CommandTask*'
      - '**/*CommandMonitor*'
      - '**/*GrzExecuteCommand*'
  push:
    paths:
      - '.github/workflows/command-process.yml'
      - '**/*Command*Process*'
      - '**/*CommandTask*'
      - '**/*CommandMonitor*'
      - '**/*GrzExecuteCommand*'

permissions:
  contents: read

concurrency:
  group: command-process-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify command processes and recovery
        run: >
          ./gradlew
          :infrastructure-ai:jvmTest --tests '*LocalCommandProcessRunnerTest' --tests '*JsonSchemaGeneratorTest'
          :application:jvmTest --tests '*DefaultCommandTaskServiceTest' --tests '*DefaultCommandMonitorServiceTest'
          :server:test --tests '*WorkerCommandRuntimeGatewayHandlerTest'
          :worker:assemble :server:assemble
          -q
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: command-process-test-results-${{ matrix.os }}
          path: |
            infrastructure-ai/build/reports/tests/jvmTest
            infrastructure-ai/build/test-results/jvmTest
            application/build/reports/tests/jvmTest
            application/build/test-results/jvmTest
            server/build/reports/tests/test
            server/build/test-results/test
          if-no-files-found: warn
          retention-days: 7
