name: Worker cross-platform checks

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      recovery_only:
        description: Run only the independent Windows update recovery checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-worker-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-update-recovery:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify interrupted Windows client update recovery
        shell: powershell
        run: ./scripts/test-windows-updates.ps1

  verify:
    if: inputs.recovery_only != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Verify Worker, Computer Use and command process contracts
        run: >
          ./gradlew
          :worker:assemble :server:assemble
          :worker:test --tests '*WorkerUpdatePreparationTest' --tests '*VisualWorkerRuntimeTest' --tests '*JvmComputerUseControllerTest' --tests '*WorkerCommandScriptBootstrapServiceTest' --tests '*WorkerWorkspaceFileServiceTest'
          :infrastructure-ai:jvmTest --tests '*GrzCaptureScreenshotToolImplTest' --tests '*GrzComputerUseToolsImplTest' --tests '*LocalCommandProcessRunnerTest' --tests '*LocalScriptSdkTest' --tests '*LocalScriptSdkTlsTest' --tests '*JsonSchemaGeneratorTest'
          :application-updates:jvmTest
          :application:jvmTest --tests '*DefaultCommandTaskServiceTest' --tests '*DefaultCommandMonitorServiceTest'
          :server:test --tests '*WorkerCommandRuntimeGatewayHandlerTest' --tests '*GrzCommandMonitorToolsTest' --tests '*ManagedCommandScriptSdkTest' --tests '*CommandScriptHttpTest' --tests '*AiCall*' --tests '*WorkspaceTextFileApplicationServiceTest'
          -q
      - name: Verify real Windows service and standard-user permissions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-worker-service.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-worker-service-${{ matrix.os }}
          path: |
            worker/build/reports/tests/test
            worker/build/test-results/test
            infrastructure-ai/build/reports/tests/jvmTest
            infrastructure-ai/build/test-results/jvmTest
            application/build/reports/tests/jvmTest
            application/build/test-results/jvmTest
            server/build/reports/tests/test
            server/build/test-results/test
          if-no-files-found: warn
          retention-days: 7
