name: Windows Worker service

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'
      - 'deploy/distribution/gromozeka-worker*'
      - 'deploy/distribution/package-standalone.sh'
      - 'scripts/test-windows-worker-service.ps1'
      - '.github/workflows/windows-worker-service.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'deploy/distribution/gromozeka-worker*'
      - 'deploy/distribution/package-standalone.sh'
      - 'scripts/test-windows-worker-service.ps1'
      - '.github/workflows/windows-worker-service.yml'

permissions:
  contents: read

concurrency:
  group: windows-worker-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build Worker and verify Computer Use contracts
        run: ./gradlew :worker:assemble :worker:test --tests '*JvmComputerUseControllerTest' -q
      - name: Verify real Windows service and standard-user permissions
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-worker-service.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-worker-service-${{ matrix.os }}
          path: worker/build/reports/tests/test
          if-no-files-found: warn
          retention-days: 7
