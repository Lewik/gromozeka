name: Diagnose E2E container DNS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect host DNS
        run: |
          cat /etc/resolv.conf
          getent ahostsv4 archive.ubuntu.com
          getent ahostsv4 security.ubuntu.com
          docker version
      - name: Probe container DNS and apt
        run: |
          docker run --rm mirror.gcr.io/library/eclipse-temurin:21-jdk-jammy bash -c '
            cat /etc/resolv.conf
            getent ahostsv4 archive.ubuntu.com
            getent ahostsv4 security.ubuntu.com
            apt-get -o APT::Update::Error-Mode=any -o Acquire::http::Timeout=20 update
          '
      - name: Probe Docker build DNS
        if: always()
        run: |
          mkdir probe
          cat > probe/Dockerfile <<'DOCKERFILE'
          FROM mirror.gcr.io/library/eclipse-temurin:21-jdk-jammy
          RUN cat /etc/resolv.conf; getent ahostsv4 archive.ubuntu.com; getent ahostsv4 security.ubuntu.com
          RUN apt-get -o APT::Update::Error-Mode=any -o Acquire::http::Timeout=20 update
          DOCKERFILE
          docker build --progress plain -t gromozeka-dns-probe probe
      - name: Probe host-network Docker build
        if: always()
        run: docker build --network host --progress plain -t gromozeka-dns-probe-host probe
