name: Diagnose Ubuntu DNS and mirrors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare DNS resolvers
        run: |
          for host in archive.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org mirror.math.princeton.edu github.com; do
            echo "$host"
            getent ahostsv4 "$host" || true
            dig +time=3 +tries=1 "$host" A || true
            dig +time=3 +tries=1 @1.1.1.1 "$host" A || true
          done
      - name: Probe signed installation through Kernel.org mirror
        run: |
          docker run --rm mirror.gcr.io/library/eclipse-temurin:21-jdk-jammy bash -ec '
            sed -i -e "s|http://archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g" -e "s|http://security.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g" /etc/apt/sources.list
            apt-get -o APT::Update::Error-Mode=any -o Acquire::https::Timeout=20 update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fontconfig libasound2 libfreetype6 libegl1 libgl1 libgtk-3-0 libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2 libxrender1 libxtst6
          '
