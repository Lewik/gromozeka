name: Diagnose Ubuntu package mirror
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Azure Ubuntu mirror
        run: |
          getent ahostsv4 azure.archive.ubuntu.com
          curl -fIL --max-time 20 https://azure.archive.ubuntu.com/ubuntu/dists/jammy/InRelease
      - name: Probe signed package installation
        run: |
          docker run --rm mirror.gcr.io/library/eclipse-temurin:21-jdk-jammy bash -ec '
            sed -i -e "s|http://archive.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g" -e "s|http://security.ubuntu.com/ubuntu|https://azure.archive.ubuntu.com/ubuntu|g" /etc/apt/sources.list
            apt-get -o APT::Update::Error-Mode=any -o Acquire::http::Timeout=20 update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fontconfig libasound2 libfreetype6 libegl1 libgl1 libgtk-3-0 libx11-6 libxcursor1 libxext6 libxi6 libxinerama1 libxrandr2 libxrender1 libxtst6
          '
