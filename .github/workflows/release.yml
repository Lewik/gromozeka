name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit release version without the v prefix. Leave empty to generate from bump.
        required: false
        default: ""
      bump:
        description: SemVer bump to generate when version is empty
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish_release:
        description: Publish GitHub Release and Server image to GHCR/ECR
        required: true
        type: boolean
        default: false
      deploy_aws:
        description: Deploy the published release to AWS production
        required: true
        type: boolean
        default: false
      skip_android:
        description: Skip Android checks and APK publication
        required: true
        type: boolean
        default: false
      skip_ios:
        description: Skip optional iOS checks; set false to verify iOS explicitly
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      deploy: ${{ steps.release.outputs.deploy }}
      latest_previous: ${{ steps.release.outputs.latest_previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow contracts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-checks"
          "$RUNNER_TEMP/ci-checks/bin/pip" install --disable-pip-version-check -r scripts/requirements-ci.txt
          "$RUNNER_TEMP/ci-checks/bin/python" scripts/test-release-workflows.py
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_DEPLOY_AWS: ${{ inputs.deploy_aws }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_PUBLISH_RELEASE" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Published releases must be dispatched from main; use build-only mode on other branches." >&2
            exit 2
          fi
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref' |
            node scripts/resolve-release-version.mjs

  verify-runtime:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start PostgreSQL for runtime checks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name runtime-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB=gromozeka \
            --env POSTGRES_USER=gromozeka \
            --env POSTGRES_PASSWORD=gromozeka \
            mirror.gcr.io/pgvector/pgvector:0.8.6-pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
          for attempt in $(seq 1 30); do
            if docker exec runtime-postgres pg_isready -U gromozeka -d gromozeka; then
              exit 0
            fi
            sleep 2
          done
          docker logs runtime-postgres
          exit 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify PostgreSQL migrations and Worker inventory
        env:
          GROMOZEKA_POSTGRES_RUNTIME_TEST: 'true'
          GROMOZEKA_POSTGRES_URL: jdbc:postgresql://localhost:5432/gromozeka
        run: >
          ./gradlew :infrastructure-db:jvmTest
          --tests '*PostgresConversationSearchRepositoryTest'
          --tests '*PostgresConversationRuntimeCoordinatorTest'
          --tests '*PostgresConversationRuntimeWorkerRegistryTest'
          --tests '*PostgresAiToolContractRepositoryTest'
          --tests '*PostgresBackgroundActivityOriginRepositoryTest'
          --tests '*PostgresSlotRepositoryTest'
          --tests '*PostgresWorkerRequestRepositoryTest'
          --tests '*CompactionCoverageMigrationTest'
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Verify Server and Worker
        run: >
          ./gradlew
          :server:test
          :worker:test
          :application:jvmTest
          --tests '*SecretArgumentSubstitutorTest'
          --tests '*NamedSecretApplicationServiceTest'
          --tests '*BackgroundActivityCompletionApplicationServiceTest'
          --tests '*BackgroundActivityLifecycleApplicationServiceTest'
          --tests '*VisualSecretArgumentsTest'
          --tests '*Slot*'
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  verify-windows-worker:
    needs: metadata
    uses: ./.github/workflows/windows-worker-service.yml

  verify-client:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify JVM client
        run: >
          ./gradlew :presentation:jvmTest
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Verify Android clients
        if: ${{ !inputs.skip_android }}
        run: >
          ./gradlew
          :presentation-android:assembleDebug
          :presentation-android:assembleRelease
          :presentation-android:test
          :presentation-android:lint
          :mobile-worker-android:assemble
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Upload Android APKs
        if: ${{ !inputs.skip_android }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apks
          path: |
            presentation-android/build/outputs/apk/**/*.apk
            mobile-worker-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload client test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-client-diagnostics
          path: |
            presentation/build/reports/tests/jvmTest
            presentation/build/test-results/jvmTest/*.xml
            presentation-android/build/reports
            presentation-android/build/test-results
            mobile-worker-android/build/reports
          if-no-files-found: warn
          retention-days: 7

  verify-web:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify Web client
        run: >
          ./gradlew
          :presentation:wasmJsBrowserTest
          :presentation:wasmJsBrowserDistribution
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Stage production Web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 1

  verify-e2e:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check interface translations and fonts
        run: |
          python3 scripts/localization.py validate
          python3 scripts/localization.py context
          python3 scripts/generate-native-localization.py --check
          python3 scripts/generate-font-resources.py --check
      - name: Verify Compose E2E
        env:
          GROMOZEKA_E2E_POSTGRES_IMAGE: mirror.gcr.io/pgvector/pgvector:0.8.6-pg18@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
          GROMOZEKA_E2E_JAVA_IMAGE: mirror.gcr.io/library/eclipse-temurin:21-jdk-jammy
        run: bash e2e-tests/run.sh
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compose-e2e-diagnostics
          path: e2e-tests/build/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

  verify-ios:
    if: ${{ !inputs.skip_ios }}
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: client-device
            tasks: ":presentation:linkReleaseFrameworkIosArm64"
          - target: client-simulator
            tasks: ":presentation:linkReleaseFrameworkIosSimulatorArm64 :presentation:iosSimulatorArm64Test"
          - target: worker-device
            tasks: ":mobile-worker:linkReleaseFrameworkIosArm64"
          - target: worker-simulator
            tasks: ":mobile-worker:linkReleaseFrameworkIosSimulatorArm64 :mobile-worker:iosSimulatorArm64Test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify iOS ${{ matrix.target }}
        run: >
          ./gradlew
          ${{ matrix.tasks }}
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  # Publication is gated on every check AND every artifact being ready. Build jobs
  # below deliberately do not depend on this gate or on tag reservation.
  verify:
    if: >-
      ${{
        !cancelled() &&
        needs.verify-runtime.result == 'success' &&
        needs.verify-windows-worker.result == 'success' &&
        needs.verify-client.result == 'success' &&
        needs.verify-web.result == 'success' &&
        needs.verify-e2e.result == 'success' &&
        (needs.verify-ios.result == 'success' ||
          (inputs.skip_ios && needs.verify-ios.result == 'skipped')) &&
        needs.runtime-inputs.result == 'success' &&
        needs.standalone.result == 'success' &&
        needs.server-image.result == 'success' &&
        needs.client-macos.result == 'success' &&
        needs.client-windows.result == 'success' &&
        needs.browser-bridge.result == 'success'
      }}
    needs:
      - verify-runtime
      - verify-windows-worker
      - verify-client
      - verify-web
      - verify-e2e
      - verify-ios
      - runtime-inputs
      - standalone
      - server-image
      - client-macos
      - client-windows
      - browser-bridge
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks and artifact builds passed"

  reserve-release-tag:
    if: ${{ !cancelled() && needs.metadata.outputs.publish == 'true' && needs.verify.result == 'success' }}
    needs:
      - metadata
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reserve release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -X POST \
            --field "ref=refs/tags/$RELEASE_TAG" \
            --field "sha=$RELEASE_SHA"

  browser-bridge:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-bridge/package-lock.json
      - name: Build and test Browser Bridge
        run: |
          npm --prefix browser-bridge ci --no-audit --no-fund
          npm --prefix browser-bridge test -- --reporter=dot
          npm --prefix browser-bridge run build
      - name: Sign Browser Bridge for Linux
        shell: bash
        env:
          BROWSER_BRIDGE_SIGNING_KEY: ${{ secrets.BROWSER_BRIDGE_SIGNING_KEY }}
        run: |
          test -n "$BROWSER_BRIDGE_SIGNING_KEY"
          command -v google-chrome >/dev/null
          key_file="$RUNNER_TEMP/gromozeka-browser-bridge.pem"
          umask 077
          printf '%s\n' "$BROWSER_BRIDGE_SIGNING_KEY" > "$key_file"
          public_key="$(openssl rsa -in "$key_file" -pubout -outform DER 2>/dev/null | base64 -w0)"
          jq -e --arg key "$public_key" '.key == $key' browser-bridge/dist/manifest.json >/dev/null
          google-chrome \
            --pack-extension="$GITHUB_WORKSPACE/browser-bridge/dist" \
            --pack-extension-key="$key_file"
          test -s browser-bridge/dist.crx
          mv browser-bridge/dist.crx browser-bridge/dist/gromozeka-browser-bridge.crx
      - name: Package unpacked Browser Bridge
        shell: bash
        run: |
          mkdir -p release-asset/gromozeka-browser-bridge
          cp -R browser-bridge/dist/. release-asset/gromozeka-browser-bridge/
          (
            cd release-asset
            zip -q -r gromozeka-browser-bridge.zip gromozeka-browser-bridge
            rm -rf gromozeka-browser-bridge
          )
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/manifest.json'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/LICENSE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/NOTICE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/THIRD_PARTY_NOTICES.txt'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/gromozeka-browser-bridge.crx'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-bridge
          path: release-asset/gromozeka-browser-bridge.zip
          if-no-files-found: error
          retention-days: 1

  client-macos:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build unsigned macOS ARM64 app
        run: |
          ./gradlew \
            :presentation:packageDmg \
            -Pgromozeka.version=${{ needs.metadata.outputs.version }} \
            -q
      - name: Verify and stage DMG
        shell: bash
        run: |
          source_dmg="$(find presentation/build/compose/binaries -type f -name '*.dmg' -print -quit)"
          app_binary="$(find presentation/build/compose/binaries -type f -path '*/Gromozeka.app/Contents/MacOS/Gromozeka' -print -quit)"
          bundled_worker="$(find presentation/build/compose/binaries -type d -path '*/resources/local-worker' -print -quit)"
          test -n "$source_dmg"
          test -n "$app_binary"
          test -z "$bundled_worker"
          test "$(uname -m)" = "arm64"
          file "$app_binary" | grep -q 'arm64'
          hdiutil verify "$source_dmg"
          mkdir -p release-asset
          cp "$source_dmg" release-asset/gromozeka-client-macos-arm64.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-macos-arm64
          path: release-asset/gromozeka-client-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  client-windows:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build portable Windows x64 client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          & ./gradlew.bat `
            :presentation:createDistributable `
            "-Pgromozeka.version=$env:RELEASE_VERSION" `
            -q
      - name: Verify and archive portable client
        shell: pwsh
        run: |
          $App = Get-ChildItem "presentation/build/compose/binaries" -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "Gromozeka.exe") } |
            Select-Object -First 1
          if ($null -eq $App) {
            throw "Gromozeka.exe was not found in the distributable"
          }
          $Runtime = Join-Path $App.FullName "runtime"
          if (-not (Test-Path $Runtime -PathType Container)) {
            throw "Bundled Java runtime directory was not found"
          }
          $JvmLibrary = Get-ChildItem $Runtime -Recurse -File -Filter "jvm.dll" |
            Select-Object -First 1
          if ($null -eq $JvmLibrary) {
            throw "Bundled JVM library was not found"
          }
          $BundledWorker = Join-Path $App.FullName "app/resources/local-worker"
          if (Test-Path $BundledWorker) {
            throw "Client distributable unexpectedly contains a bundled Worker"
          }
          Copy-Item "LICENSE" (Join-Path $App.FullName "LICENSE")
          Copy-Item "THIRD_PARTY_NOTICES.md" (Join-Path $App.FullName "THIRD_PARTY_NOTICES.md")
          New-Item -ItemType Directory -Force "release-asset" | Out-Null
          Compress-Archive `
            -Path (Join-Path $App.FullName "*") `
            -DestinationPath "release-asset/gromozeka-client-windows-x64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-windows-x64
          path: release-asset/gromozeka-client-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  worker-launcher-macos:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build stable macOS ARM64 Worker launcher
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          mkdir -p build/native-launchers/macos-arm64
          cc -Os -arch arm64 -mmacosx-version-min=12.0 \
            deploy/distribution/macos-worker-launcher.c \
            -framework CoreGraphics \
            -framework ApplicationServices \
            -o build/native-launchers/macos-arm64/gromozeka-worker-launcher
          strip build/native-launchers/macos-arm64/gromozeka-worker-launcher
          file build/native-launchers/macos-arm64/gromozeka-worker-launcher | grep -q 'arm64'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-launcher-macos-arm64
          path: build/native-launchers/macos-arm64/gromozeka-worker-launcher
          if-no-files-found: error
          retention-days: 1

  runtime-inputs:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build release JARs and verify Browser MCP once
        run: |
          npm --prefix browser-mcp ci --no-audit --no-fund
          npm --prefix browser-mcp test
          npm --prefix browser-mcp run verify
          ./gradlew :server:bootJar :worker:bootJar \
            -Pgromozeka.version=${{ needs.metadata.outputs.version }} -q
          mkdir -p build/release
          tar -czf build/release/browser-mcp-runtime.tar.gz browser-mcp/node_modules
      - name: Stage shared release JARs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-jars
          path: |
            server/build/libs/gromozeka-server.jar
            worker/build/libs/gromozeka-worker.jar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Stage Browser MCP runtime with file modes and links
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-mcp-runtime
          path: build/release/browser-mcp-runtime.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  standalone:
    needs:
      - metadata
      - runtime-inputs
      - verify-web
      - worker-launcher-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            architecture: arm64
          - platform: linux
            architecture: x64
          - platform: windows
            architecture: x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Restore shared release JARs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-jars
          path: .
      - name: Restore Browser MCP runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-mcp-runtime
          path: build/release
      - name: Unpack Browser MCP runtime
        run: tar -xzf build/release/browser-mcp-runtime.tar.gz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-launcher-macos-arm64
          path: build/native-launchers/macos-arm64
      - name: Prepare native launchers
        run: chmod +x build/native-launchers/macos-arm64/gromozeka-worker-launcher
      - name: Restore production Web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - name: Package standalone Server and Worker for this platform
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          # Ubuntu 24.04 hosted runners already include Brotli; no network setup.
          command -v brotli
          brotli --version
          echo "Packaging standalone artifacts for $PLATFORM/$ARCHITECTURE"
          bash deploy/distribution/package-standalone.sh server "$PLATFORM" "$ARCHITECTURE" release-asset
          bash deploy/distribution/package-standalone.sh worker "$PLATFORM" "$ARCHITECTURE" release-asset
      - name: Verify standalone archives
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          for component in server worker; do
            listing="$RUNNER_TEMP/$component.entries"
            root="gromozeka-$component-$PLATFORM-$ARCHITECTURE"
            if [[ "$PLATFORM" == windows ]]; then
              unzip -tq "release-asset/$root.zip"
              unzip -Z1 "release-asset/$root.zip" > "$listing"
              grep -q '/runtime/java/bin/java.exe$' "$listing"
            else
              tar -tzf "release-asset/$root.tar.gz" > "$listing"
              if [[ "$PLATFORM" == macos ]]; then
                grep -q '/runtime/java/Contents/Home/bin/java$' "$listing"
              else
                grep -q '/runtime/java/bin/java$' "$listing"
              fi
            fi
            grep -q '/runtime/java/.*legal/' "$listing"
            if [[ "$component" == server ]]; then
              grep -q '/web/index.html$' "$listing"
              if grep -q '/runtime/node/' "$listing"; then
                echo "Server archive unexpectedly contains the unused Node.js runtime" >&2
                exit 2
              fi
            else
              grep -q '/app/browser-mcp/node_modules/@playwright/mcp/cli.js$' "$listing"
              grep -q '/runtime/node/LICENSE$' "$listing"
              if [[ "$PLATFORM" == windows ]]; then
                grep -q '/runtime/node/node.exe$' "$listing"
                grep -q '/bin/gromozeka-worker-service.ps1$' "$listing"
              else
                grep -q '/runtime/node/bin/node$' "$listing"
              fi
              if [[ "$PLATFORM" == macos ]]; then
                grep -q '/app/native/gromozeka-worker-launcher$' "$listing"
                grep -q '/bin/gromozeka-worker-service$' "$listing"
              fi
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-packages-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-asset/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Build without registry credentials or publication. This can run alongside
  # remaining tests and packaging as soon as the Web assets and JARs exist.
  server-image:
    needs:
      - metadata
      - runtime-inputs
      - verify-web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check preinstalled OCI tools
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo
          skopeo --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-jars
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - name: Build Server image as an OCI artifact
        timeout-minutes: 15
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          build-args: |
            JAVA_RUNTIME_IMAGE=mirror.gcr.io/library/eclipse-temurin:21-jre-noble@sha256:ca397720325ceefe39ce397f186759fc87d9efafb2dc4ce53315980844c2f4f2
          platforms: linux/amd64
          push: false
          tags: ghcr.io/lewik/gromozeka-server:${{ needs.metadata.outputs.version }}
          outputs: type=oci,dest=${{ runner.temp }}/server-image.tar
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server
      - name: Verify OCI artifact can be copied without changing digests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/server-image.tar"
          echo "Verifying local OCI archive (no registry access)"
          skopeo --command-timeout 3m copy --all --preserve-digests \
            "oci-archive:$RUNNER_TEMP/server-image.tar" "oci:$RUNNER_TEMP/verified-server-image:release"
          echo "OCI digest-preserving copy verified"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Copy the already-built OCI image; never rebuild after the verification gate.
  images:
    if: >-
      ${{
        !cancelled() &&
        needs.metadata.outputs.publish == 'true' &&
        needs.verify.result == 'success' &&
        needs.reserve-release-tag.result == 'success' &&
        needs.server-image.result == 'success'
      }}
    needs:
      - metadata
      - verify
      - reserve-release-tag
      - server-image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-image
          path: build/release
      - name: Check preinstalled OCI publisher
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo
          skopeo --version
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GROMOZEKA_BUILD_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified Server image
        timeout-minutes: 18
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          ECR_SERVER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_SERVER_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          test -n "$ECR_SERVER_REPOSITORY"
          source_image="oci-archive:$PWD/build/release/server-image.tar"
          auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          test -s "$auth_file"
          for destination in "ghcr.io/lewik/gromozeka-server:$VERSION" "$ECR_SERVER_REPOSITORY:$VERSION"; do
            echo "Publishing verified OCI image to $destination"
            skopeo --command-timeout 5m copy --all --preserve-digests --authfile "$auth_file" "$source_image" "docker://$destination"
          done
          if [[ "$PRERELEASE" == false ]]; then
            echo "Updating GHCR latest from the same verified OCI artifact"
            skopeo --command-timeout 5m copy --all --preserve-digests --authfile "$auth_file" \
              "$source_image" docker://ghcr.io/lewik/gromozeka-server:latest
          fi
          echo "Server image publication completed"

  release:
    if: >-
      ${{
        !cancelled() &&
        needs.metadata.outputs.publish == 'true' &&
        needs.metadata.result == 'success' &&
        needs.verify.result == 'success' &&
        needs.client-macos.result == 'success' &&
        needs.client-windows.result == 'success' &&
        needs.standalone.result == 'success' &&
        needs.browser-bridge.result == 'success' &&
        needs.images.result == 'success'
      }}
    needs:
      - metadata
      - verify
      - client-macos
      - client-windows
      - standalone
      - browser-bridge
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Client artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Download standalone artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-packages-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Download Browser Bridge artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-bridge
          path: downloaded-artifacts
      - name: Download Android APKs
        if: ${{ !inputs.skip_android }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-apks
          path: android-apks
      - name: Prepare release assets
        shell: bash
        env:
          SKIP_ANDROID: ${{ inputs.skip_android }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          if [[ "$SKIP_ANDROID" != "true" ]]; then
            cp android-apks/mobile-worker-android/build/outputs/apk/debug/mobile-worker-android-debug.apk \
              release-assets/gromozeka-worker-android-debug.apk
            cp android-apks/presentation-android/build/outputs/apk/debug/presentation-android-debug.apk \
              release-assets/gromozeka-client-android-debug.apk
          fi
          mkdir -p server-stack/certs
          cp deploy/distribution/compose.yaml server-stack/compose.yaml
          cp deploy/distribution/Caddyfile server-stack/Caddyfile
          cp deploy/distribution/Caddyfile.internal server-stack/Caddyfile.internal
          cp deploy/distribution/Caddyfile.provided server-stack/Caddyfile.provided
          cp deploy/distribution/SERVER_README.md server-stack/README.md
          cp LICENSE server-stack/LICENSE
          sed \
            's/^GROMOZEKA_VERSION=.*/GROMOZEKA_VERSION=${{ needs.metadata.outputs.version }}/' \
            deploy/distribution/gromozeka.env.example \
            > server-stack/gromozeka.env.example
          (
            cd server-stack
            zip -q -r ../release-assets/gromozeka-server-stack.zip .
          )
          (
            cd release-assets
            assets=(
              gromozeka-client-macos-arm64.dmg
              gromozeka-client-windows-x64.zip
              gromozeka-server-stack.zip
              gromozeka-server-macos-arm64.tar.gz
              gromozeka-server-windows-x64.zip
              gromozeka-server-linux-x64.tar.gz
              gromozeka-worker-macos-arm64.tar.gz
              gromozeka-worker-windows-x64.zip
              gromozeka-worker-linux-x64.tar.gz
              gromozeka-browser-bridge.zip
            )
            if [[ "$SKIP_ANDROID" != "true" ]]; then
              assets+=(gromozeka-client-android-debug.apk gromozeka-worker-android-debug.apk)
            fi
            sha256sum "${assets[@]}" > SHA256SUMS
          )
      - name: Write release notes
        shell: bash
        env:
          SKIP_ANDROID: ${{ inputs.skip_android }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          - macOS ARM64 Client: `gromozeka-client-macos-arm64.dmg`
          - Windows x64 portable Client: `gromozeka-client-windows-x64.zip`
          - Docker Compose Server stack: `gromozeka-server-stack.zip`
          - macOS ARM64 standalone Server: `gromozeka-server-macos-arm64.tar.gz`
          - Windows x64 standalone Server: `gromozeka-server-windows-x64.zip`
          - Linux x64 standalone Server: `gromozeka-server-linux-x64.tar.gz`
          - macOS ARM64 Worker: `gromozeka-worker-macos-arm64.tar.gz`
          - Windows x64 Worker: `gromozeka-worker-windows-x64.zip`
          - Linux x64 Worker: `gromozeka-worker-linux-x64.tar.gz`
          - Chrome/Edge/Chromium Browser Bridge: `gromozeka-browser-bridge.zip`

          Load the extracted Browser Bridge directory from `chrome://extensions` with
          Developer mode enabled; it can coexist with the official Playwright Extension.
          Standalone Server and Worker packages include checksum-verified Java and, where
          Browser MCP is available, Node.js. They do not install system runtimes or download
          executable code on first launch. The desktop and Worker packages are currently
          unsigned. macOS Gatekeeper and
          Windows SmartScreen may require explicit confirmation on first launch.
          Verify downloaded files against `SHA256SUMS`.
          EOF
          if [[ "$SKIP_ANDROID" != "true" ]]; then
            cat >> release-notes.md <<'EOF'

          ## Android

          - Android Client (debug-signed APK): `gromozeka-client-android-debug.apk`
          - Android Worker (debug-signed APK): `gromozeka-worker-android-debug.apk`

          Android APKs use a debug signing key and are intended for manual installation.
          The signing key may change between CI runs, so upgrading an existing Android
          installation can require reinstallation and device enrollment again.
          EOF
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gromozeka ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true

  deploy:
    if: >-
      ${{
        !cancelled() &&
        needs.metadata.outputs.deploy == 'true' &&
        needs.metadata.result == 'success' &&
        needs.release.result == 'success'
      }}
    needs:
      - metadata
      - release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
