name: Release and Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit release version without the v prefix. Leave empty to generate from bump.
        required: false
        default: ""
      bump:
        description: SemVer bump to generate when version is empty
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish_release:
        description: Publish GitHub Release and GHCR images
        required: true
        type: boolean
        default: false
      deploy_aws:
        description: Deploy the published release to AWS production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      deploy: ${{ steps.release.outputs.deploy }}
      latest_previous: ${{ steps.release.outputs.latest_previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_DEPLOY_AWS: ${{ inputs.deploy_aws }}
        run: |
          set -euo pipefail
          gh api \
            --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref' |
            node scripts/resolve-release-version.mjs

  verify-runtime:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Server and Worker
        run: >
          ./gradlew
          :server:test
          :worker:test
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  verify-client:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify JVM and Android clients
        run: >
          ./gradlew
          :presentation:jvmTest
          :presentation-android:assembleDebug
          :presentation-android:assembleRelease
          :presentation-android:test
          :presentation-android:lint
          :mobile-worker-android:assemble
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  verify-web:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify Web client
        run: >
          ./gradlew
          :presentation:wasmJsBrowserTest
          :presentation:wasmJsBrowserDistribution
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Stage production Web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 1

  verify-e2e:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Compose E2E
        run: bash e2e-tests/run.sh
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-compose-e2e-diagnostics
          path: e2e-tests/build/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

  verify-ios:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: client-device
            tasks: ":presentation:linkReleaseFrameworkIosArm64"
          - target: client-simulator
            tasks: ":presentation:linkReleaseFrameworkIosSimulatorArm64 :presentation:iosSimulatorArm64Test"
          - target: worker-device
            tasks: ":mobile-worker:linkReleaseFrameworkIosArm64"
          - target: worker-simulator
            tasks: ":mobile-worker:linkReleaseFrameworkIosSimulatorArm64 :mobile-worker:iosSimulatorArm64Test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify iOS ${{ matrix.target }}
        run: >
          ./gradlew
          ${{ matrix.tasks }}
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  verify:
    needs:
      - verify-runtime
      - verify-client
      - verify-web
      - verify-e2e
      - verify-ios
    runs-on: ubuntu-latest
    steps:
      - run: echo "All release source checks passed"

  reserve-release-tag:
    needs:
      - metadata
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Reserve release tag
        if: needs.metadata.outputs.publish == 'true' && github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -X POST \
            --field "ref=refs/tags/$RELEASE_TAG" \
            --field "sha=$RELEASE_SHA"
      - name: Skip tag reservation
        if: needs.metadata.outputs.publish != 'true' || github.event_name == 'push'
        run: echo "Release tag already exists or publishing is disabled; no tag reservation needed"

  browser-bridge:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-bridge/package-lock.json
      - name: Build and test Browser Bridge
        run: |
          npm --prefix browser-bridge ci --no-audit --no-fund
          npm --prefix browser-bridge test -- --reporter=dot
          npm --prefix browser-bridge run build
      - name: Sign Browser Bridge for Linux
        shell: bash
        env:
          BROWSER_BRIDGE_SIGNING_KEY: ${{ secrets.BROWSER_BRIDGE_SIGNING_KEY }}
        run: |
          test -n "$BROWSER_BRIDGE_SIGNING_KEY"
          command -v google-chrome >/dev/null
          key_file="$RUNNER_TEMP/gromozeka-browser-bridge.pem"
          umask 077
          printf '%s\n' "$BROWSER_BRIDGE_SIGNING_KEY" > "$key_file"
          public_key="$(openssl rsa -in "$key_file" -pubout -outform DER 2>/dev/null | base64 -w0)"
          jq -e --arg key "$public_key" '.key == $key' browser-bridge/dist/manifest.json >/dev/null
          google-chrome \
            --pack-extension="$GITHUB_WORKSPACE/browser-bridge/dist" \
            --pack-extension-key="$key_file"
          test -s browser-bridge/dist.crx
          mv browser-bridge/dist.crx browser-bridge/dist/gromozeka-browser-bridge.crx
      - name: Package unpacked Browser Bridge
        shell: bash
        run: |
          mkdir -p release-asset/gromozeka-browser-bridge
          cp -R browser-bridge/dist/. release-asset/gromozeka-browser-bridge/
          (
            cd release-asset
            zip -q -r gromozeka-browser-bridge.zip gromozeka-browser-bridge
            rm -rf gromozeka-browser-bridge
          )
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/manifest.json'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/LICENSE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/NOTICE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/THIRD_PARTY_NOTICES.txt'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/gromozeka-browser-bridge.crx'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-bridge
          path: release-asset/gromozeka-browser-bridge.zip
          if-no-files-found: error
          retention-days: 1

  client-macos:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build Browser MCP and unsigned macOS ARM64 app
        run: |
          npm --prefix browser-mcp ci --no-audit --no-fund
          npm --prefix browser-mcp run verify --silent
          ./gradlew \
            :presentation:packageDmg \
            -Pgromozeka.version=${{ needs.metadata.outputs.version }} \
            -q
      - name: Verify and stage DMG
        shell: bash
        run: |
          source_dmg="$(find presentation/build/compose/binaries -type f -name '*.dmg' -print -quit)"
          app_binary="$(find presentation/build/compose/binaries -type f -path '*/Gromozeka.app/Contents/MacOS/Gromozeka' -print -quit)"
          test -n "$source_dmg"
          test -n "$app_binary"
          worker_jar="$(find presentation/build/compose/binaries -type f -path '*/resources/local-worker/app/gromozeka-worker.jar' -print -quit)"
          worker_java="$(find presentation/build/compose/binaries -type f -path '*/resources/local-worker/runtime/java/Contents/Home/bin/java' -print -quit)"
          worker_node="$(find presentation/build/compose/binaries -type f -path '*/resources/local-worker/runtime/node/bin/node' -print -quit)"
          worker_service="$(find presentation/build/compose/binaries -type f -path '*/resources/local-worker/bin/gromozeka-worker-service' -print -quit)"
          browser_mcp="$(find presentation/build/compose/binaries -type f -path '*/resources/local-worker/app/browser-mcp/node_modules/@playwright/mcp/cli.js' -print -quit)"
          test -n "$worker_jar"
          test -x "$worker_java"
          test -x "$worker_node"
          test -n "$worker_service"
          test -n "$browser_mcp"
          test -d "$(dirname "$(dirname "$worker_java")")/legal"
          test -f "$(dirname "$(dirname "$worker_node")")/LICENSE"
          test "$(uname -m)" = "arm64"
          file "$app_binary" | grep -q 'arm64'
          file "$worker_java" | grep -q 'arm64'
          file "$worker_node" | grep -q 'arm64'
          hdiutil verify "$source_dmg"
          mkdir -p release-asset
          cp "$source_dmg" release-asset/gromozeka-client-macos-arm64.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-macos-arm64
          path: release-asset/gromozeka-client-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  client-windows:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build Browser MCP and portable Windows x64 client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          npm --prefix browser-mcp ci --no-audit --no-fund
          npm --prefix browser-mcp run verify --silent
          & ./gradlew.bat `
            :presentation:createDistributable `
            "-Pgromozeka.version=$env:RELEASE_VERSION" `
            -q
      - name: Verify and archive portable client
        shell: pwsh
        run: |
          $App = Get-ChildItem "presentation/build/compose/binaries" -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "Gromozeka.exe") } |
            Select-Object -First 1
          if ($null -eq $App) {
            throw "Gromozeka.exe was not found in the distributable"
          }
          $Runtime = Join-Path $App.FullName "runtime"
          if (-not (Test-Path $Runtime -PathType Container)) {
            throw "Bundled Java runtime directory was not found"
          }
          $JvmLibrary = Get-ChildItem $Runtime -Recurse -File -Filter "jvm.dll" |
            Select-Object -First 1
          if ($null -eq $JvmLibrary) {
            throw "Bundled JVM library was not found"
          }
          $WorkerJar = Join-Path $App.FullName "app/resources/local-worker/app/gromozeka-worker.jar"
          if (-not (Test-Path $WorkerJar -PathType Leaf)) {
            throw "Bundled Local Worker JAR was not found"
          }
          $WorkerJava = Join-Path $App.FullName "app/resources/local-worker/runtime/java/bin/java.exe"
          if (-not (Test-Path $WorkerJava -PathType Leaf)) {
            throw "Bundled Local Worker Java runtime was not found"
          }
          $WorkerNode = Join-Path $App.FullName "app/resources/local-worker/runtime/node/node.exe"
          if (-not (Test-Path $WorkerNode -PathType Leaf)) {
            throw "Bundled Local Worker Node.js runtime was not found"
          }
          $WorkerJavaLegal = Join-Path $App.FullName "app/resources/local-worker/runtime/java/legal"
          if (-not (Test-Path $WorkerJavaLegal -PathType Container)) {
            throw "Bundled Local Worker Java legal notices were not found"
          }
          $WorkerNodeLicense = Join-Path $App.FullName "app/resources/local-worker/runtime/node/LICENSE"
          if (-not (Test-Path $WorkerNodeLicense -PathType Leaf)) {
            throw "Bundled Local Worker Node.js LICENSE was not found"
          }
          $BrowserLauncher = Join-Path $App.FullName "app/resources/local-worker/bin/gromozeka-browser-mcp.cmd"
          if (-not (Test-Path $BrowserLauncher -PathType Leaf)) {
            throw "Bundled Browser MCP launcher was not found"
          }
          $BrowserMcp = Join-Path $App.FullName "app/resources/local-worker/app/browser-mcp/node_modules/@playwright/mcp/cli.js"
          if (-not (Test-Path $BrowserMcp -PathType Leaf)) {
            throw "Bundled Browser MCP package was not found"
          }
          Copy-Item "LICENSE" (Join-Path $App.FullName "LICENSE")
          Copy-Item "THIRD_PARTY_NOTICES.md" (Join-Path $App.FullName "THIRD_PARTY_NOTICES.md")
          New-Item -ItemType Directory -Force "release-asset" | Out-Null
          Compress-Archive `
            -Path (Join-Path $App.FullName "*") `
            -DestinationPath "release-asset/gromozeka-client-windows-x64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-windows-x64
          path: release-asset/gromozeka-client-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  worker-launcher-macos:
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build stable macOS ARM64 Worker launcher
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          mkdir -p build/native-launchers/macos-arm64
          cc -Os -arch arm64 -mmacosx-version-min=12.0 \
            deploy/distribution/macos-worker-launcher.c \
            -framework CoreGraphics \
            -framework ApplicationServices \
            -o build/native-launchers/macos-arm64/gromozeka-worker-launcher
          strip build/native-launchers/macos-arm64/gromozeka-worker-launcher
          file build/native-launchers/macos-arm64/gromozeka-worker-launcher | grep -q 'arm64'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-launcher-macos-arm64
          path: build/native-launchers/macos-arm64/gromozeka-worker-launcher
          if-no-files-found: error
          retention-days: 1

  standalone:
    needs:
      - metadata
      - verify-web
      - worker-launcher-macos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-launcher-macos-arm64
          path: build/native-launchers/macos-arm64
      - name: Prepare native launchers
        run: chmod +x build/native-launchers/macos-arm64/gromozeka-worker-launcher
      - name: Restore production Web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - name: Build standalone application jars and Browser MCP
        run: |
          npm --prefix browser-mcp ci --no-audit --no-fund
          npm --prefix browser-mcp test
          npm --prefix browser-mcp run verify
          ./gradlew \
            :server:bootJar \
            :worker:bootJar \
            -Pgromozeka.version=${{ needs.metadata.outputs.version }} \
            -q
      - name: Package self-contained standalone distributions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends brotli >/dev/null
          chmod +x deploy/distribution/package-standalone.sh
          for target in macos:arm64 linux:x64 windows:x64; do
            platform="${target%%:*}"
            architecture="${target##*:}"
            deploy/distribution/package-standalone.sh server "$platform" "$architecture" release-asset
            deploy/distribution/package-standalone.sh worker "$platform" "$architecture" release-asset
          done
      - name: Verify standalone archives
        shell: bash
        run: |
          for archive in \
            release-asset/gromozeka-server-macos-arm64.tar.gz \
            release-asset/gromozeka-server-linux-x64.tar.gz \
            release-asset/gromozeka-worker-macos-arm64.tar.gz \
            release-asset/gromozeka-worker-linux-x64.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done
          for archive in \
            release-asset/gromozeka-server-windows-x64.zip \
            release-asset/gromozeka-worker-windows-x64.zip; do
            unzip -tq "$archive" >/dev/null
          done
          tar -tzf release-asset/gromozeka-worker-linux-x64.tar.gz > worker-linux.entries
          tar -tzf release-asset/gromozeka-server-linux-x64.tar.gz > server-linux.entries
          grep -q '/app/browser-mcp/node_modules/@playwright/mcp/cli.js$' worker-linux.entries
          grep -q '/runtime/java/bin/java$' worker-linux.entries
          grep -q '/runtime/java/legal/' worker-linux.entries
          grep -q '/runtime/node/bin/node$' worker-linux.entries
          grep -q '/runtime/node/LICENSE$' worker-linux.entries
          grep -q '/runtime/java/bin/java$' server-linux.entries
          grep -q '/web/index.html$' server-linux.entries
          tar -tzf release-asset/gromozeka-worker-macos-arm64.tar.gz > worker-macos.entries
          grep -q '/app/native/gromozeka-worker-launcher$' worker-macos.entries
          grep -q '/bin/gromozeka-worker-service$' worker-macos.entries
          grep -q '/runtime/java/Contents/Home/bin/java$' worker-macos.entries
          grep -q '/runtime/node/bin/node$' worker-macos.entries
          unzip -Z1 release-asset/gromozeka-worker-windows-x64.zip > worker-windows.entries
          grep -q '/runtime/java/bin/java.exe$' worker-windows.entries
          grep -q '/runtime/node/node.exe$' worker-windows.entries
          grep -q '/runtime/node/LICENSE$' worker-windows.entries
          if grep -q '/runtime/node/' server-linux.entries; then
            echo "Server archive unexpectedly contains the unused Node.js runtime" >&2
            exit 2
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-packages
          path: release-asset/*
          if-no-files-found: error
          retention-days: 1

  images:
    needs:
      - metadata
      - reserve-release-tag
      - verify-web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Restore production Web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - name: Assemble image inputs
        run: >
          ./gradlew
          :server:bootJar
          :worker:bootJar
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Configure AWS credentials
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GROMOZEKA_BUILD_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.metadata.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release image tags
        id: image-tags
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PUBLISH: ${{ needs.metadata.outputs.publish }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          ECR_SERVER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_SERVER_REPOSITORY_URL }}
          ECR_WORKER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_WORKER_REPOSITORY_URL }}
        run: |
          {
            echo "server<<EOF"
            echo "ghcr.io/lewik/gromozeka-server:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-server:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_SERVER_REPOSITORY"
              echo "$ECR_SERVER_REPOSITORY:$VERSION"
            fi
            echo "EOF"

            echo "worker<<EOF"
            echo "ghcr.io/lewik/gromozeka-worker:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-worker:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_WORKER_REPOSITORY"
              echo "$ECR_WORKER_REPOSITORY:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build Server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.server }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server
      - name: Build Worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.worker }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=release-worker

  release:
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - verify
      - client-macos
      - client-windows
      - standalone
      - browser-bridge
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Client artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Download standalone artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-packages
          path: downloaded-artifacts
      - name: Download Browser Bridge artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-bridge
          path: downloaded-artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          mkdir -p server-stack/certs
          cp deploy/distribution/compose.yaml server-stack/compose.yaml
          cp deploy/distribution/Caddyfile server-stack/Caddyfile
          cp deploy/distribution/Caddyfile.internal server-stack/Caddyfile.internal
          cp deploy/distribution/Caddyfile.provided server-stack/Caddyfile.provided
          cp deploy/distribution/SERVER_README.md server-stack/README.md
          cp LICENSE server-stack/LICENSE
          sed \
            's/^GROMOZEKA_VERSION=.*/GROMOZEKA_VERSION=${{ needs.metadata.outputs.version }}/' \
            deploy/distribution/gromozeka.env.example \
            > server-stack/gromozeka.env.example
          (
            cd server-stack
            zip -q -r ../release-assets/gromozeka-server-stack.zip .
          )
          (
            cd release-assets
            sha256sum \
              gromozeka-client-macos-arm64.dmg \
              gromozeka-client-windows-x64.zip \
              gromozeka-server-stack.zip \
              gromozeka-server-macos-arm64.tar.gz \
              gromozeka-server-windows-x64.zip \
              gromozeka-server-linux-x64.tar.gz \
              gromozeka-worker-macos-arm64.tar.gz \
              gromozeka-worker-windows-x64.zip \
              gromozeka-worker-linux-x64.tar.gz \
              gromozeka-browser-bridge.zip \
              > SHA256SUMS
          )
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          - macOS ARM64 app with optional Local Worker: `gromozeka-client-macos-arm64.dmg`
          - Windows x64 portable Client: `gromozeka-client-windows-x64.zip`
          - Docker Compose Server stack: `gromozeka-server-stack.zip`
          - macOS ARM64 standalone Server: `gromozeka-server-macos-arm64.tar.gz`
          - Windows x64 standalone Server: `gromozeka-server-windows-x64.zip`
          - Linux x64 standalone Server: `gromozeka-server-linux-x64.tar.gz`
          - macOS ARM64 Worker: `gromozeka-worker-macos-arm64.tar.gz`
          - Windows x64 Worker: `gromozeka-worker-windows-x64.zip`
          - Linux x64 Worker: `gromozeka-worker-linux-x64.tar.gz`
          - Chrome/Edge/Chromium Browser Bridge: `gromozeka-browser-bridge.zip`

          Load the extracted Browser Bridge directory from `chrome://extensions` with
          Developer mode enabled; it can coexist with the official Playwright Extension.
          Standalone Server and Worker packages include checksum-verified Java and, where
          Browser MCP is available, Node.js. They do not install system runtimes or download
          executable code on first launch. The desktop and Worker packages are currently
          unsigned. macOS Gatekeeper and
          Windows SmartScreen may require explicit confirmation on first launch.
          Verify downloaded files against `SHA256SUMS`.
          EOF
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gromozeka ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true

  deploy:
    if: needs.metadata.outputs.deploy == 'true'
    needs:
      - metadata
      - release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
