name: Release and Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "0.0.0-dev"
      publish_release:
        description: Publish GitHub Release and GHCR images
        required: true
        type: boolean
        default: false
      deploy_aws:
        description: Deploy the published release to AWS production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            publish=true
            deploy=true
          else
            version="${{ inputs.version }}"
            tag="v$version"
            publish="${{ inputs.publish_release }}"
            deploy="${{ inputs.deploy_aws }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 2
          fi
          if [[ "$publish" == "true" && "$version" == "0.0.0-dev" ]]; then
            echo "0.0.0-dev is reserved for local builds and cannot be published" >&2
            exit 2
          fi
          if [[ "$deploy" == "true" && "$publish" != "true" ]]; then
            echo "deploy_aws=true requires publish_release=true" >&2
            exit 2
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          printf 'version=%s\ntag=%s\npublish=%s\nprerelease=%s\ndeploy=%s\n' \
            "$version" "$tag" "$publish" "$prerelease" "$deploy" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify release source
        run: >
          ./gradlew
          :presentation:build
          :server:test
          :worker:test
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q

  client-macos:
    needs: [metadata, verify]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned macOS ARM64 client
        run: >
          ./gradlew
          :presentation:packageDmg
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Verify and stage DMG
        shell: bash
        run: |
          source_dmg="$(find presentation/build/compose/binaries -type f -name '*.dmg' -print -quit)"
          app_binary="$(find presentation/build/compose/binaries -type f -path '*/Gromozeka.app/Contents/MacOS/Gromozeka' -print -quit)"
          test -n "$source_dmg"
          test -n "$app_binary"
          test "$(uname -m)" = "arm64"
          file "$app_binary" | grep -q 'arm64'
          hdiutil verify "$source_dmg"
          mkdir -p release-asset
          cp "$source_dmg" release-asset/gromozeka-client-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-arm64
          path: release-asset/gromozeka-client-macos-arm64.dmg
          if-no-files-found: error

  client-windows:
    needs: [metadata, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build portable Windows x64 client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          & ./gradlew.bat `
            :presentation:createDistributable `
            "-Pgromozeka.version=$env:RELEASE_VERSION" `
            -q
      - name: Verify and archive portable client
        shell: pwsh
        run: |
          $App = Get-ChildItem "presentation/build/compose/binaries" -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "Gromozeka.exe") } |
            Select-Object -First 1
          if ($null -eq $App) {
            throw "Gromozeka.exe was not found in the distributable"
          }
          $Runtime = Join-Path $App.FullName "runtime"
          if (-not (Test-Path $Runtime -PathType Container)) {
            throw "Bundled Java runtime directory was not found"
          }
          $JvmLibrary = Get-ChildItem $Runtime -Recurse -File -Filter "jvm.dll" |
            Select-Object -First 1
          if ($null -eq $JvmLibrary) {
            throw "Bundled JVM library was not found"
          }
          Copy-Item "LICENSE" (Join-Path $App.FullName "LICENSE")
          New-Item -ItemType Directory -Force "release-asset" | Out-Null
          Compress-Archive `
            -Path (Join-Path $App.FullName "*") `
            -DestinationPath "release-asset/gromozeka-client-windows-x64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-x64
          path: release-asset/gromozeka-client-windows-x64.zip
          if-no-files-found: error

  worker-unix:
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: macos
            architecture: arm64
          - runner: ubuntu-latest
            platform: linux
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Worker
        run: >
          ./gradlew
          :worker:bootJar
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Package Worker with Java runtime
        shell: bash
        run: |
          chmod +x deploy/distribution/package-worker.sh
          deploy/distribution/package-worker.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.architecture }}" \
            release-asset
          archive="release-asset/gromozeka-worker-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz"
          package_root="gromozeka-worker-${{ matrix.platform }}-${{ matrix.architecture }}"
          tar -tzf "$archive" \
            "$package_root/runtime/bin/java" \
            "$package_root/app/gromozeka-worker.jar" \
            "$package_root/LICENSE"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-asset/gromozeka-worker-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  worker-windows:
    needs: [metadata, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Worker
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          & ./gradlew.bat `
            :worker:bootJar `
            "-Pgromozeka.version=$env:RELEASE_VERSION" `
            -q
      - name: Package Worker with Java runtime
        shell: pwsh
        run: |
          deploy/distribution/package-worker.ps1 -OutputDirectory release-asset
          $Archive = "release-asset/gromozeka-worker-windows-x64.zip"
          if (-not (Test-Path $Archive)) {
            throw "Worker archive was not created"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $Zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $Archive))
          try {
            $Entries = $Zip.Entries.FullName.Replace("\", "/")
            $RequiredEntries = @(
              "gromozeka-worker-windows-x64/runtime/bin/java.exe",
              "gromozeka-worker-windows-x64/app/gromozeka-worker.jar",
              "gromozeka-worker-windows-x64/LICENSE"
            )
            foreach ($Entry in $RequiredEntries) {
              if ($Entries -notcontains $Entry) {
                throw "Worker archive is missing $Entry"
              }
            }
          }
          finally {
            $Zip.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: worker-windows-x64
          path: release-asset/gromozeka-worker-windows-x64.zip
          if-no-files-found: error

  images:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble image inputs
        run: >
          ./gradlew
          :server:bootJar
          :worker:bootJar
          :presentation:wasmJsBrowserDistribution
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GROMOZEKA_BUILD_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/login-action@v4
        if: needs.metadata.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release image tags
        id: image-tags
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PUBLISH: ${{ needs.metadata.outputs.publish }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          ECR_SERVER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_SERVER_REPOSITORY_URL }}
          ECR_WORKER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_WORKER_REPOSITORY_URL }}
        run: |
          {
            echo "server<<EOF"
            echo "ghcr.io/lewik/gromozeka-server:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-server:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_SERVER_REPOSITORY"
              echo "$ECR_SERVER_REPOSITORY:$VERSION"
            fi
            echo "EOF"

            echo "worker<<EOF"
            echo "ghcr.io/lewik/gromozeka-worker:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-worker:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_WORKER_REPOSITORY"
              echo "$ECR_WORKER_REPOSITORY:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.server }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server
      - name: Build Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.worker }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=release-worker

  release:
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - client-macos
      - client-windows
      - worker-unix
      - worker-windows
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          cp deploy/distribution/compose.yaml release-assets/compose.yaml
          sed \
            's/^GROMOZEKA_VERSION=.*/GROMOZEKA_VERSION=${{ needs.metadata.outputs.version }}/' \
            deploy/distribution/gromozeka.env.example \
            > release-assets/gromozeka.env.example
          (
            cd release-assets
            sha256sum \
              gromozeka-client-macos-arm64.dmg \
              gromozeka-client-windows-x64.zip \
              gromozeka-worker-macos-arm64.tar.gz \
              gromozeka-worker-windows-x64.zip \
              gromozeka-worker-linux-x64.tar.gz \
              compose.yaml \
              gromozeka.env.example \
              > SHA256SUMS
          )
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          - macOS ARM64 Client: `gromozeka-client-macos-arm64.dmg`
          - Windows x64 portable Client: `gromozeka-client-windows-x64.zip`
          - macOS ARM64 Worker: `gromozeka-worker-macos-arm64.tar.gz`
          - Windows x64 Worker: `gromozeka-worker-windows-x64.zip`
          - Linux x64 Worker: `gromozeka-worker-linux-x64.tar.gz`
          - Self-hosted stack: `compose.yaml` and `gromozeka.env.example`

          The desktop packages are currently unsigned. macOS Gatekeeper and
          Windows SmartScreen may require explicit confirmation on first launch.
          Verify downloaded files against `SHA256SUMS`.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gromozeka ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true

  deploy:
    if: needs.metadata.outputs.deploy == 'true'
    needs:
      - metadata
      - release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
