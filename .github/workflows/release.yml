name: Release and Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "0.0.0-dev"
      publish_release:
        description: Publish GitHub Release and GHCR images
        required: true
        type: boolean
        default: false
      deploy_aws:
        description: Deploy the published release to AWS production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - id: release
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
            publish=true
            deploy=true
          else
            version="${{ inputs.version }}"
            tag="v$version"
            publish="${{ inputs.publish_release }}"
            deploy="${{ inputs.deploy_aws }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 2
          fi
          if [[ "$publish" == "true" && "$version" == "0.0.0-dev" ]]; then
            echo "0.0.0-dev is reserved for local builds and cannot be published" >&2
            exit 2
          fi
          if [[ "$deploy" == "true" && "$publish" != "true" ]]; then
            echo "deploy_aws=true requires publish_release=true" >&2
            exit 2
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          printf 'version=%s\ntag=%s\npublish=%s\nprerelease=%s\ndeploy=%s\n' \
            "$version" "$tag" "$publish" "$prerelease" "$deploy" >> "$GITHUB_OUTPUT"

  verify:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Verify release source
        run: >
          ./gradlew
          :presentation:build
          :presentation:wasmJsBrowserDistribution
          :server:test
          :worker:test
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Stage production Web client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 1

  browser-bridge:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-bridge/package-lock.json
      - name: Build and test Browser Bridge
        run: |
          npm --prefix browser-bridge ci --no-audit --no-fund
          npm --prefix browser-bridge test -- --reporter=dot
          npm --prefix browser-bridge run build
      - name: Sign Browser Bridge for Linux
        shell: bash
        env:
          BROWSER_BRIDGE_SIGNING_KEY: ${{ secrets.BROWSER_BRIDGE_SIGNING_KEY }}
        run: |
          test -n "$BROWSER_BRIDGE_SIGNING_KEY"
          command -v google-chrome >/dev/null
          key_file="$RUNNER_TEMP/gromozeka-browser-bridge.pem"
          umask 077
          printf '%s\n' "$BROWSER_BRIDGE_SIGNING_KEY" > "$key_file"
          public_key="$(openssl rsa -in "$key_file" -pubout -outform DER 2>/dev/null | base64 -w0)"
          jq -e --arg key "$public_key" '.key == $key' browser-bridge/dist/manifest.json >/dev/null
          google-chrome \
            --pack-extension="$GITHUB_WORKSPACE/browser-bridge/dist" \
            --pack-extension-key="$key_file"
          test -s browser-bridge/dist.crx
          mv browser-bridge/dist.crx browser-bridge/dist/gromozeka-browser-bridge.crx
      - name: Package unpacked Browser Bridge
        shell: bash
        run: |
          mkdir -p release-asset/gromozeka-browser-bridge
          cp -R browser-bridge/dist/. release-asset/gromozeka-browser-bridge/
          (
            cd release-asset
            zip -q -r gromozeka-browser-bridge.zip gromozeka-browser-bridge
            rm -rf gromozeka-browser-bridge
          )
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/manifest.json'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/LICENSE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/NOTICE'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/THIRD_PARTY_NOTICES.txt'
          unzip -Z1 release-asset/gromozeka-browser-bridge.zip | grep -qx 'gromozeka-browser-bridge/gromozeka-browser-bridge.crx'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-bridge
          path: release-asset/gromozeka-browser-bridge.zip
          if-no-files-found: error
          retention-days: 1

  client-macos:
    needs: [metadata, verify]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build unsigned macOS ARM64 client
        run: >
          ./gradlew
          :presentation:packageDmg
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - name: Verify and stage DMG
        shell: bash
        run: |
          source_dmg="$(find presentation/build/compose/binaries -type f -name '*.dmg' -print -quit)"
          app_binary="$(find presentation/build/compose/binaries -type f -path '*/Gromozeka.app/Contents/MacOS/Gromozeka' -print -quit)"
          test -n "$source_dmg"
          test -n "$app_binary"
          test "$(uname -m)" = "arm64"
          file "$app_binary" | grep -q 'arm64'
          hdiutil verify "$source_dmg"
          mkdir -p release-asset
          cp "$source_dmg" release-asset/gromozeka-client-macos-arm64.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-macos-arm64
          path: release-asset/gromozeka-client-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 1

  client-windows:
    needs: [metadata, verify]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build portable Windows x64 client
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          & ./gradlew.bat `
            :presentation:createDistributable `
            "-Pgromozeka.version=$env:RELEASE_VERSION" `
            -q
      - name: Verify and archive portable client
        shell: pwsh
        run: |
          $App = Get-ChildItem "presentation/build/compose/binaries" -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "Gromozeka.exe") } |
            Select-Object -First 1
          if ($null -eq $App) {
            throw "Gromozeka.exe was not found in the distributable"
          }
          $Runtime = Join-Path $App.FullName "runtime"
          if (-not (Test-Path $Runtime -PathType Container)) {
            throw "Bundled Java runtime directory was not found"
          }
          $JvmLibrary = Get-ChildItem $Runtime -Recurse -File -Filter "jvm.dll" |
            Select-Object -First 1
          if ($null -eq $JvmLibrary) {
            throw "Bundled JVM library was not found"
          }
          Copy-Item "LICENSE" (Join-Path $App.FullName "LICENSE")
          New-Item -ItemType Directory -Force "release-asset" | Out-Null
          Compress-Archive `
            -Path (Join-Path $App.FullName "*") `
            -DestinationPath "release-asset/gromozeka-client-windows-x64.zip" `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-windows-x64
          path: release-asset/gromozeka-client-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  standalone:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Restore production Web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - name: Build standalone application jars and Browser MCP
        run: |
          npm --prefix browser-mcp ci --no-audit --no-fund
          npm --prefix browser-mcp test
          npm --prefix browser-mcp run verify
          ./gradlew \
            :server:bootJar \
            :worker:bootJar \
            -Pgromozeka.version=${{ needs.metadata.outputs.version }} \
            -q
      - name: Package thin standalone distributions
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends brotli >/dev/null
          chmod +x deploy/distribution/package-standalone.sh
          for target in macos:arm64 linux:x64 windows:x64; do
            platform="${target%%:*}"
            architecture="${target##*:}"
            deploy/distribution/package-standalone.sh server "$platform" "$architecture" release-asset
            deploy/distribution/package-standalone.sh worker "$platform" "$architecture" release-asset
          done
      - name: Verify standalone archives
        shell: bash
        run: |
          for archive in \
            release-asset/gromozeka-server-macos-arm64.tar.gz \
            release-asset/gromozeka-server-linux-x64.tar.gz \
            release-asset/gromozeka-worker-macos-arm64.tar.gz \
            release-asset/gromozeka-worker-linux-x64.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done
          for archive in \
            release-asset/gromozeka-server-windows-x64.zip \
            release-asset/gromozeka-worker-windows-x64.zip; do
            unzip -tq "$archive" >/dev/null
          done
          tar -tzf release-asset/gromozeka-worker-linux-x64.tar.gz > worker-linux.entries
          tar -tzf release-asset/gromozeka-server-linux-x64.tar.gz > server-linux.entries
          grep -q '/app/browser-mcp/node_modules/@playwright/mcp/cli.js$' worker-linux.entries
          grep -q '/bin/runtime-versions.properties$' worker-linux.entries
          grep -q '/web/index.html$' server-linux.entries
          if grep -q '/runtime/' worker-linux.entries; then
            echo "Thin Worker archive unexpectedly contains a Java runtime" >&2
            exit 2
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-packages
          path: release-asset/*
          if-no-files-found: error
          retention-days: 1

  images:
    needs: [metadata, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Restore production Web client
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-web-assets
          path: presentation/build/dist/wasmJs/productionExecutable
      - name: Assemble image inputs
        run: >
          ./gradlew
          :server:bootJar
          :worker:bootJar
          -Pgromozeka.version=${{ needs.metadata.outputs.version }}
          -q
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Configure AWS credentials
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_GROMOZEKA_BUILD_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Log in to Amazon ECR
        if: needs.metadata.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.metadata.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve release image tags
        id: image-tags
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PUBLISH: ${{ needs.metadata.outputs.publish }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          ECR_SERVER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_SERVER_REPOSITORY_URL }}
          ECR_WORKER_REPOSITORY: ${{ vars.AWS_GROMOZEKA_WORKER_REPOSITORY_URL }}
        run: |
          {
            echo "server<<EOF"
            echo "ghcr.io/lewik/gromozeka-server:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-server:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_SERVER_REPOSITORY"
              echo "$ECR_SERVER_REPOSITORY:$VERSION"
            fi
            echo "EOF"

            echo "worker<<EOF"
            echo "ghcr.io/lewik/gromozeka-worker:$VERSION"
            if [[ "$PRERELEASE" == "false" ]]; then
              echo "ghcr.io/lewik/gromozeka-worker:latest"
            fi
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_WORKER_REPOSITORY"
              echo "$ECR_WORKER_REPOSITORY:$VERSION"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build Server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.server }}
          cache-from: type=gha,scope=release-server
          cache-to: type=gha,mode=max,scope=release-server
      - name: Build Worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/worker.Dockerfile
          platforms: linux/amd64
          push: ${{ needs.metadata.outputs.publish == 'true' }}
          load: ${{ needs.metadata.outputs.publish != 'true' }}
          tags: ${{ steps.image-tags.outputs.worker }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=release-worker

  release:
    if: needs.metadata.outputs.publish == 'true'
    needs:
      - metadata
      - client-macos
      - client-windows
      - standalone
      - browser-bridge
      - images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Client artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: client-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Download standalone artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-packages
          path: downloaded-artifacts
      - name: Download Browser Bridge artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-bridge
          path: downloaded-artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f -exec cp {} release-assets/ \;
          mkdir -p server-stack/certs
          cp deploy/distribution/compose.yaml server-stack/compose.yaml
          cp deploy/distribution/Caddyfile server-stack/Caddyfile
          cp deploy/distribution/Caddyfile.internal server-stack/Caddyfile.internal
          cp deploy/distribution/Caddyfile.provided server-stack/Caddyfile.provided
          cp deploy/distribution/SERVER_README.md server-stack/README.md
          cp LICENSE server-stack/LICENSE
          sed \
            's/^GROMOZEKA_VERSION=.*/GROMOZEKA_VERSION=${{ needs.metadata.outputs.version }}/' \
            deploy/distribution/gromozeka.env.example \
            > server-stack/gromozeka.env.example
          (
            cd server-stack
            zip -q -r ../release-assets/gromozeka-server-stack.zip .
          )
          (
            cd release-assets
            sha256sum \
              gromozeka-client-macos-arm64.dmg \
              gromozeka-client-windows-x64.zip \
              gromozeka-server-stack.zip \
              gromozeka-server-macos-arm64.tar.gz \
              gromozeka-server-windows-x64.zip \
              gromozeka-server-linux-x64.tar.gz \
              gromozeka-worker-macos-arm64.tar.gz \
              gromozeka-worker-windows-x64.zip \
              gromozeka-worker-linux-x64.tar.gz \
              gromozeka-browser-bridge.zip \
              > SHA256SUMS
          )
      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Downloads

          - macOS ARM64 Client: `gromozeka-client-macos-arm64.dmg`
          - Windows x64 portable Client: `gromozeka-client-windows-x64.zip`
          - Docker Compose Server stack: `gromozeka-server-stack.zip`
          - macOS ARM64 standalone Server: `gromozeka-server-macos-arm64.tar.gz`
          - Windows x64 standalone Server: `gromozeka-server-windows-x64.zip`
          - Linux x64 standalone Server: `gromozeka-server-linux-x64.tar.gz`
          - macOS ARM64 Worker: `gromozeka-worker-macos-arm64.tar.gz`
          - Windows x64 Worker: `gromozeka-worker-windows-x64.zip`
          - Linux x64 Worker: `gromozeka-worker-linux-x64.tar.gz`
          - Chrome/Edge/Chromium Browser Bridge: `gromozeka-browser-bridge.zip`

          Load the extracted Browser Bridge directory from `chrome://extensions` with
          Developer mode enabled; it can coexist with the official Playwright Extension.
          Standalone Server and Worker launchers use compatible system runtimes or download
          checksum-pinned Java/Node runtimes once. The desktop and Worker packages are
          currently unsigned. macOS Gatekeeper and
          Windows SmartScreen may require explicit confirmation on first launch.
          Verify downloaded files against `SHA256SUMS`.
          EOF
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gromozeka ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          generate_release_notes: true

  deploy:
    if: needs.metadata.outputs.deploy == 'true'
    needs:
      - metadata
      - release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit
