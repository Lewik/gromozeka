spring:
  main:
    web-application-type: none
  banner:
    location: classpath:banner.txt

# Reranker Configuration
reranker:
  auto-start: false
  url: http://localhost:7997
  model: mixedbread-ai/mxbai-rerank-xsmall-v1
  python-version: "3.12"
  startup-timeout-seconds: 120

gromozeka:
  worker-enrollment:
    enabled: ${GROMOZEKA_WORKER_ENROLLMENT_ENABLED:false}
    token-ttl-minutes: ${GROMOZEKA_WORKER_ENROLLMENT_TOKEN_TTL_MINUTES:15}
    capabilities: ${GROMOZEKA_WORKER_ENROLLMENT_CAPABILITIES:AI_REQUEST_RESPONSE,TOOL_EXECUTION,LOCAL_AGENT_TOOL}
  runtime:
    server:
      enabled: true
    worker:
      enabled: false
